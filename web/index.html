<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScamShield</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand-mark">S</div>
      <div>
        <p class="eyebrow">INDIA MULTI-CHANNEL DEFENCE</p>
        <h1>ScamShield</h1>
      </div>
    </header>

    <section class="grid">
      <form id="analyzer" class="panel">
        <div class="tabs" aria-label="Message channel">
          <label><input type="radio" name="channel" value="sms" checked> SMS</label>
          <label><input type="radio" name="channel" value="whatsapp"> WhatsApp</label>
          <label><input type="radio" name="channel" value="email"> Email</label>
          <label><input type="radio" name="channel" value="url"> URL</label>
        </div>
        <label for="message">Paste the suspicious message</label>
        <textarea id="message" maxlength="10000" placeholder="Example: Aapka account blocked hai. Abhi KYC verify karein: http://..."></textarea>
        <button type="submit" id="analyze-button">Analyze threat</button>
      </form>

      <aside class="panel result" id="result" aria-live="polite">
        <p class="placeholder">Risk analysis will appear here.</p>
      </aside>
    </section>

    <section class="stats panel">
      <h2>Local intelligence</h2>
      <div id="stats">Loading statistics...</div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
